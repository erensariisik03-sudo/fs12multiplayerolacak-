name: Build MultiplayerMod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android NDK r16b
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r16b-linux-x86_64.zip
          unzip -q android-ndk-r16b-linux-x86_64.zip
          mv android-ndk-r16b "$HOME/android-ndk-r16b"

      - name: Check NDK
        run: |
          "$HOME/android-ndk-r16b/ndk-build" --version

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/android-ndk-r16b/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi \
            -DANDROID_PLATFORM=android-15 \
            -DANDROID_STL=gnustl_static \
            -DANDROID_TOOLCHAIN=clang \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release -j2

      - name: Verify generated library
        run: |
          echo "Generated files:"
          find build -type f -name "*.so" -print
          echo
          echo "Checking libmultiplayermod.so..."
          test -f build/libmultiplayermod.so
          ls -lh build/libmultiplayermod.so

      - name: Upload libmultiplayermod.so
        uses: actions/upload-artifact@v4
        with:
          name: MultiplayerMod-armeabi
          path: build/libmultiplayermod.so
```
